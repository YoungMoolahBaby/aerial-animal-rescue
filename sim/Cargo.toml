[package]
name = "storm_sim"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Storm and disaster sim for aerial-animal-rescue: synthetic data and vehicles in weather"

[dependencies]
# Same pair as the cortenforge-play prototype, known to work together.
# Only the sim family (it brings cf-geometry, cf-spatial); mesh and fabrication aren't
# needed. See sim/FINDINGS.md: the sim umbrella itself can't be narrowed further.
cortenforge = { version = "0.9.0", default-features = false, features = ["sim"] }
bevy = "0.19.1"

# The first release build of Bevy is slow; dependencies don't change often.
[profile.dev.package."*"]
opt-level = 3
