[project]
name = "aerial-animal-rescue"
version = "0.1.0"
description = "Aerial (RGB + thermal) dataset and baseline detector for finding pets and livestock in flood and disaster scenes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "ultralytics",
    "torch",
    "torchvision",
    "opencv-python",
    "numpy",
    "pillow",
    "pyyaml",
    "pandas",
    "huggingface_hub",
    "datasets",
    "tqdm",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_animal_rescue"]

# PyPI's Windows torch wheels are CPU-only: take the CUDA 13.0 build there.
# Linux PyPI wheels already include CUDA; macOS keeps the default wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
